name: release

# Obsidian requires the tag to match manifest.json exactly, with no "v"
# prefix — so this triggers on 1.2.3, not v1.2.3.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  # Needed to sign the built assets so users can verify they came from this
  # repository. The community store's automated review checks for these.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # `npm ci` builds from the committed lockfile, so the release is
      # reproducible byte-for-byte rather than picking up whatever versions
      # happen to resolve on the day.
      - name: build
        run: |
          npm ci
          npm run build

      - name: check the tag matches manifest.json
        run: |
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - name: attest the built assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      # The community store expects these loose on the release, not zipped.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
